name: Build, sign and publish XO Lite RPM

on:
  push:
    branches:
      - release/hydron
      # Temporary trigger while this workflow is being tested.
      - dev/hydron/PRNEPHORA-62_Add_Action_for_RPM_Build_and_Signature
    tags:
      - rpm-hydron-*

permissions:
  contents: read

env:
  BUILDER_REF: gcr.io/whitestack-private/nephora/xcp-ng-build-env:hydron-rpm-sign-v1
  BUILD_ENV_TAG: hydron-rpm-sign-v1
  BUILD_ENV_COMMIT: d6200a7ce87633bf1e3d7466601b248cf3b58bdd

jobs:
  build-sign-publish:
    name: Build and sign nc-lite RPM
    runs-on: ubuntu-latest

    steps:
      - name: Set XO release
        run: echo "XO_RELEASE=${GITHUB_REF_NAME##*/}" >> "${GITHUB_ENV}"

      - name: Check out nc-lite
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check out pinned xcp-ng-build-env
        uses: actions/checkout@v5
        with:
          repository: whitestack/xcp-ng-build-env
          ref: ${{ env.BUILD_ENV_COMMIT }}
          path: _xcp-ng-build-env
          persist-credentials: false

      - name: Authenticate to the WhiteStack container registry
        shell: bash
        env:
          GCP_SA: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail

          : "${GCP_SA:?GCP_SERVICE_ACCOUNT is required}"

          GCP_KEY_FILE="${RUNNER_TEMP}/gcp-service-account.json"

          cleanup_gcp_key() {
              rm -f "${GCP_KEY_FILE}"
          }

          trap cleanup_gcp_key EXIT

          printf '%s' "${GCP_SA}" > "${GCP_KEY_FILE}"
          chmod 0600 "${GCP_KEY_FILE}"

          SERVICE_ACCOUNT_PROJECT="$(
              jq -er '.project_id' "${GCP_KEY_FILE}"
          )"

          gcloud auth activate-service-account \
              --key-file="${GCP_KEY_FILE}" \
              --project="${SERVICE_ACCOUNT_PROJECT}"

          gcloud auth configure-docker \
              --quiet \
              gcr.io

          docker pull "${BUILDER_REF}"

      - name: Prepare RPM workspace
        shell: bash
        run: |
          set -euo pipefail

          BUILD_ROOT="${RUNNER_TEMP}/xo-lite-rpm-${GITHUB_RUN_ID}"
          RPM_WORK="${BUILD_ROOT}/rpmbuild"
          RPM_OUTPUT="${BUILD_ROOT}/output"
          SIGNING_DIR="${BUILD_ROOT}/signing"
          DIST_DIR="${GITHUB_WORKSPACE}/dist"
          RPM_RELEASE="100.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"

          install -d \
              "${RPM_WORK}" \
              "${RPM_OUTPUT}" \
              "${SIGNING_DIR}" \
              "${DIST_DIR}"

          git archive "${GITHUB_SHA}" | tar -x -C "${RPM_WORK}"

          install -d \
              "${RPM_WORK}/BUILD" \
              "${RPM_WORK}/BUILDROOT" \
              "${RPM_WORK}/RPMS" \
              "${RPM_WORK}/SOURCES" \
              "${RPM_WORK}/SRPMS"

          sed -i -E \
              "s/^[[:space:]]*Release:.*/Release: ${RPM_RELEASE}%{?dist}/" \
              "${RPM_WORK}/SPECS/xo-lite.spec"

          grep -nE \
              '^(Epoch|Name|Version|Release|Source)' \
              "${RPM_WORK}/SPECS/xo-lite.spec"

          docker run --rm \
              --user root \
              -v "${RPM_WORK}:/mounted-work" \
              -v "${RPM_OUTPUT}:/mounted-output" \
              "${BUILDER_REF}" \
              bash --noprofile --norc -c '
                  set -euo pipefail

                  BUILDER_UID="$(id -u builder)"
                  BUILDER_GID="$(id -g builder)"

                  chown -R \
                      "${BUILDER_UID}:${BUILDER_GID}" \
                      /mounted-work \
                      /mounted-output

                  chmod -R \
                      u+rwX,go+rX \
                      /mounted-work \
                      /mounted-output
              '

          {
              printf 'BUILD_ROOT=%s\n' "${BUILD_ROOT}"
              printf 'RPM_WORK=%s\n' "${RPM_WORK}"
              printf 'RPM_OUTPUT=%s\n' "${RPM_OUTPUT}"
              printf 'SIGNING_DIR=%s\n' "${SIGNING_DIR}"
              printf 'DIST_DIR=%s\n' "${DIST_DIR}"
              printf 'RPM_RELEASE=%s\n' "${RPM_RELEASE}"
          } >> "${GITHUB_ENV}"

      - name: Build nc-lite RPM
        shell: bash
        run: |
          set -euo pipefail

          chmod 0755 _xcp-ng-build-env/run.py

          _xcp-ng-build-env/run.py \
              --rm \
              --fail-on-error \
              --name "xo_lite_${GITHUB_RUN_ID}" \
              --env "WS_RELEASE=${XO_RELEASE}" \
              --branch "${BUILD_ENV_TAG}" \
              --disablerepo 'C7.5.1804-*' \
              --build-local "${RPM_WORK}" \
              --output-dir "${RPM_OUTPUT}"

          mapfile -t BUILT_RPMS < <(
              find "${RPM_OUTPUT}/RPMS" \
                  -type f \
                  -name 'nephora-nc-lite-*.rpm' \
                  | sort
          )

          if [ "${#BUILT_RPMS[@]}" -ne 1 ]; then
              echo "Expected exactly one nc-lite RPM; found ${#BUILT_RPMS[@]}." >&2
              printf '%s\n' "${BUILT_RPMS[@]}" >&2
              exit 1
          fi

          RPM_RELATIVE="${BUILT_RPMS[0]#"${RPM_OUTPUT}/"}"

          printf 'RPM_RELATIVE=%s\n' "${RPM_RELATIVE}" \
              >> "${GITHUB_ENV}"

          printf 'Built RPM: %s\n' "${BUILT_RPMS[0]}"

      - name: Sign and verify RPM
        shell: bash
        env:
          RPM_GPG_PRIVATE_KEY_B64: ${{ secrets.RPM_GPG_PRIVATE_KEY_B64 }}
          RPM_GPG_EXPECTED_FINGERPRINT: ${{ vars.RPM_GPG_EXPECTED_FINGERPRINT }}
        run: |
          set -euo pipefail

          : "${RPM_GPG_PRIVATE_KEY_B64:?RPM_GPG_PRIVATE_KEY_B64 is required}"
          : "${RPM_GPG_EXPECTED_FINGERPRINT:?RPM_GPG_EXPECTED_FINGERPRINT is required}"

          PRIVATE_KEY_FILE="${SIGNING_DIR}/private-key.asc"

          cleanup_private_key() {
              rm -f "${PRIVATE_KEY_FILE}"
          }

          trap cleanup_private_key EXIT

          printf '%s' "${RPM_GPG_PRIVATE_KEY_B64}" |
              base64 --decode \
              > "${PRIVATE_KEY_FILE}"

          chmod 0600 "${PRIVATE_KEY_FILE}"

          docker run --rm \
              --user root \
              --env "EXPECTED_FPR=${RPM_GPG_EXPECTED_FINGERPRINT}" \
              --env "RPM_RELATIVE=${RPM_RELATIVE}" \
              -v "${SIGNING_DIR}:/signing" \
              -v "${RPM_OUTPUT}:/output" \
              -v "${GITHUB_WORKSPACE}/.ci:/ci:ro" \
              "${BUILDER_REF}" \
              /ci/sign-rpm.sh

          test -s "${SIGNING_DIR}/key-fingerprint"
          test -s "${SIGNING_DIR}/RPM-GPG-KEY-xo-lite"
          test -s "${SIGNING_DIR}/key-source"

          cleanup_private_key
          trap - EXIT

      - name: Prepare publication bundle
        shell: bash
        run: |
          set -euo pipefail

          RPM_FILE="${RPM_OUTPUT}/${RPM_RELATIVE}"
          RPM_BASENAME="$(basename "${RPM_FILE}")"
          PUBLIC_KEY="${SIGNING_DIR}/RPM-GPG-KEY-xo-lite"

          test -s "${RPM_FILE}"
          test -s "${PUBLIC_KEY}"

          install -m 0644 \
              "${RPM_FILE}" \
              "${DIST_DIR}/${RPM_BASENAME}"

          install -m 0644 \
              "${PUBLIC_KEY}" \
              "${DIST_DIR}/RPM-GPG-KEY-xo-lite"

          (
              cd "${DIST_DIR}"

              sha256sum "${RPM_BASENAME}" > SHA256SUMS

              {
                  printf 'RPM_FILE=%s\n' "${RPM_BASENAME}"
                  printf 'RPM_RELEASE=%s\n' "${RPM_RELEASE}"
                  printf 'GITHUB_SHA=%s\n' "${GITHUB_SHA}"
                  printf 'GITHUB_RUN_ID=%s\n' "${GITHUB_RUN_ID}"
                  printf 'GITHUB_RUN_NUMBER=%s\n' "${GITHUB_RUN_NUMBER}"
                  printf 'GITHUB_RUN_ATTEMPT=%s\n' "${GITHUB_RUN_ATTEMPT}"
                  printf 'GPG_KEY_SOURCE=%s\n' "$(<"${SIGNING_DIR}/key-source")"
                  printf 'GPG_FINGERPRINT=%s\n' \
                      "$(tr -d '[:space:]' < "${SIGNING_DIR}/key-fingerprint")"
              } > manifest.env
          )

          printf 'RPM_BASENAME=%s\n' "${RPM_BASENAME}" \
              >> "${GITHUB_ENV}"

          find "${DIST_DIR}" \
              -maxdepth 1 \
              -type f \
              -printf '%f\n' \
              | sort

      - name: Save signed RPM as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: nc-lite-rpm
          path: |
            dist/*.rpm
            dist/RPM-GPG-KEY-xo-lite
            dist/SHA256SUMS
            dist/manifest.env
          retention-days: 30
          if-no-files-found: error

      - name: Upload signed RPM to Google Artifact Registry
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_LOCATION: ${{ vars.GCP_LOCATION }}
          GAR_YUM_REPOSITORY: ${{ vars.GAR_YUM_REPOSITORY }}
        run: |
          set -euo pipefail

          : "${GCP_PROJECT_ID:?GCP_PROJECT_ID is required}"
          : "${GCP_LOCATION:?GCP_LOCATION is required}"
          : "${GAR_YUM_REPOSITORY:?GAR_YUM_REPOSITORY is required}"
          : "${RPM_BASENAME:?RPM_BASENAME is required}"

          gcloud artifacts yum upload \
              "${GAR_YUM_REPOSITORY}" \
              --project="${GCP_PROJECT_ID}" \
              --location="${GCP_LOCATION}" \
              --source="${DIST_DIR}/${RPM_BASENAME}" \
              --quiet

name: Build, sign and publish XO Lite RPM

on:
  workflow_dispatch:
    inputs:
      publish_to_google:
        description: Upload the signed RPM to Google Artifact Registry
        required: true
        type: boolean
        default: false

  push:
    branches:
      - release/hydron
      # Temporary trigger while this workflow is being tested.
      - dev/hydron/PRNEPHORA-62_Add_Action_for_RPM_Build_and_Signature
    tags:
      - hydron-*

permissions:
  contents: read

env:
  BASE_BUILDER_REF: gcr.io/whitestack-private/nephora/xcp-ng-build-env:hydron
  BUILDER_REF: gcr.io/whitestack-private/nephora/xcp-ng-build-env:hydron-poc-fixed
  BUILD_ENV_COMMIT: d1cf1092c3b114b572ceb707b6a00f25416ff42b
  XO_RELEASE: hydron

jobs:
  build-sign-publish:
    name: Build and sign xo-lite RPM
    runs-on: ubuntu-latest

    steps:
      - name: Check out xo-lite
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check out pinned xcp-ng-build-env
        uses: actions/checkout@v5
        with:
          repository: whitestack/xcp-ng-build-env
          ref: ${{ env.BUILD_ENV_COMMIT }}
          path: _xcp-ng-build-env
          persist-credentials: false

      - name: Authenticate to the WhiteStack container registry
        shell: bash
        env:
          GCP_SA: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail

          : "${GCP_SA:?GCP_SERVICE_ACCOUNT is required}"

          GCP_KEY_FILE="${RUNNER_TEMP}/gcp-service-account.json"
          trap 'rm -f "${GCP_KEY_FILE}"' EXIT

          printf '%s' "${GCP_SA}" > "${GCP_KEY_FILE}"
          chmod 0600 "${GCP_KEY_FILE}"

          SERVICE_ACCOUNT_PROJECT="$(
              jq -er '.project_id' "${GCP_KEY_FILE}"
          )"

          gcloud auth activate-service-account \
              --key-file="${GCP_KEY_FILE}" \
              --project="${SERVICE_ACCOUNT_PROJECT}"

          gcloud auth configure-docker \
              --quiet \
              gcr.io,us-central1-docker.pkg.dev

          docker pull "${BASE_BUILDER_REF}"

      - name: Build corrected RPM builder image
        shell: bash
        run: |
          set -euo pipefail

          docker build \
              --file .ci/Dockerfile.hydron-rpm \
              --tag "${BUILDER_REF}" \
              .ci

          docker run --rm \
              --entrypoint /bin/bash \
              "${BUILDER_REF}" \
              -lc '
                  set -euo pipefail
                  grep "^baseurl=" /etc/yum.repos.d/CentOS-Vault-7.5.repo
                  command -v rpmsign
              '

      - name: Prepare RPM workspace
        shell: bash
        run: |
          set -euo pipefail

          BUILD_ROOT="${RUNNER_TEMP}/xo-lite-rpm-${GITHUB_RUN_ID}"
          RPM_WORK="${BUILD_ROOT}/rpmbuild"
          RPM_OUTPUT="${BUILD_ROOT}/output"
          SIGNING_DIR="${BUILD_ROOT}/signing"
          DIST_DIR="${GITHUB_WORKSPACE}/dist"
          RPM_RELEASE="100.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"

          install -d \
              "${RPM_WORK}" \
              "${RPM_OUTPUT}" \
              "${SIGNING_DIR}" \
              "${DIST_DIR}"

          git archive "${GITHUB_SHA}" | tar -x -C "${RPM_WORK}"

          install -d \
              "${RPM_WORK}/BUILD" \
              "${RPM_WORK}/BUILDROOT" \
              "${RPM_WORK}/RPMS" \
              "${RPM_WORK}/SOURCES" \
              "${RPM_WORK}/SRPMS"

          sed -i -E \
              "s/^[[:space:]]*Release:.*/Release: ${RPM_RELEASE}%{?dist}/" \
              "${RPM_WORK}/SPECS/xo-lite.spec"

          grep -nE \
              '^(Epoch|Name|Version|Release|Source)' \
              "${RPM_WORK}/SPECS/xo-lite.spec"

          docker run --rm \
              --user root \
              -v "${RPM_WORK}:/mounted-work" \
              -v "${RPM_OUTPUT}:/mounted-output" \
              "${BUILDER_REF}" \
              bash --noprofile --norc -c '
                  set -euo pipefail

                  BUILDER_UID="$(id -u builder)"
                  BUILDER_GID="$(id -g builder)"

                  chown -R \
                      "${BUILDER_UID}:${BUILDER_GID}" \
                      /mounted-work \
                      /mounted-output

                  chmod -R \
                      u+rwX,go+rX \
                      /mounted-work \
                      /mounted-output
              '

          {
              printf 'BUILD_ROOT=%s\n' "${BUILD_ROOT}"
              printf 'RPM_WORK=%s\n' "${RPM_WORK}"
              printf 'RPM_OUTPUT=%s\n' "${RPM_OUTPUT}"
              printf 'SIGNING_DIR=%s\n' "${SIGNING_DIR}"
              printf 'DIST_DIR=%s\n' "${DIST_DIR}"
              printf 'RPM_RELEASE=%s\n' "${RPM_RELEASE}"
          } >> "${GITHUB_ENV}"

      - name: Build xo-lite RPM
        shell: bash
        run: |
          set -euo pipefail

          chmod 0755 _xcp-ng-build-env/run.py

          _xcp-ng-build-env/run.py \
              --rm \
              --fail-on-error \
              --name "xo_lite_${GITHUB_RUN_ID}" \
              --env "WS_RELEASE=${XO_RELEASE}" \
              --branch hydron-poc-fixed \
              --disablerepo 'C7.5.1804-*' \
              --build-local "${RPM_WORK}" \
              --output-dir "${RPM_OUTPUT}"

          mapfile -t BUILT_RPMS < <(
              find "${RPM_OUTPUT}/RPMS" \
                  -type f \
                  -name 'xo-lite-*.rpm' \
                  | sort
          )

          if [ "${#BUILT_RPMS[@]}" -ne 1 ]; then
              echo "Expected exactly one xo-lite RPM; found ${#BUILT_RPMS[@]}." >&2
              printf '%s\n' "${BUILT_RPMS[@]}" >&2
              exit 1
          fi

          RPM_RELATIVE="${BUILT_RPMS[0]#"${RPM_OUTPUT}/"}"

          printf 'RPM_RELATIVE=%s\n' "${RPM_RELATIVE}" \
              >> "${GITHUB_ENV}"

          printf 'Built RPM: %s\n' "${BUILT_RPMS[0]}"

      - name: Sign and verify RPM
        shell: bash
        env:
          # Until this secret exists, the workflow creates a disposable POC key.
          RPM_GPG_PRIVATE_KEY_B64: ${{ secrets.RPM_GPG_PRIVATE_KEY_B64 }}
          RPM_GPG_EXPECTED_FINGERPRINT: ${{ vars.RPM_GPG_EXPECTED_FINGERPRINT }}
        run: |
          set -euo pipefail

          PRIVATE_KEY_FILE="${SIGNING_DIR}/private-key.asc"

          cleanup_private_key_file() {
              rm -f "${PRIVATE_KEY_FILE}"
          }
          trap cleanup_private_key_file EXIT

          if [ -n "${RPM_GPG_PRIVATE_KEY_B64}" ]; then
              printf '%s' "${RPM_GPG_PRIVATE_KEY_B64}" \
                  | base64 --decode \
                  > "${PRIVATE_KEY_FILE}"

              chmod 0600 "${PRIVATE_KEY_FILE}"
          fi

          docker run --rm -i \
              --user root \
              --env "EXPECTED_FPR=${RPM_GPG_EXPECTED_FINGERPRINT}" \
              --env "RPM_RELATIVE=${RPM_RELATIVE}" \
              -v "${SIGNING_DIR}:/signing" \
              -v "${RPM_OUTPUT}:/output" \
              "${BUILDER_REF}" \
              bash --noprofile --norc -s <<'IN_SIGNER'
          set -euo pipefail

          KEY_HOME='/signing/gnupg'
          PRIVATE_KEY='/signing/private-key.asc'
          FINGERPRINT_FILE='/signing/key-fingerprint'
          PUBLIC_KEY='/signing/RPM-GPG-KEY-xo-lite'
          RPM_FILE="/output/${RPM_RELATIVE}"

          cleanup_private_material() {
              rm -f \
                  "${PRIVATE_KEY}" \
                  /signing/generate-key.batch
              rm -rf "${KEY_HOME}"
          }
          trap cleanup_private_material EXIT

          install -d -m 0700 "${KEY_HOME}"
          test -s "${RPM_FILE}"

          if [ -s "${PRIVATE_KEY}" ]; then
              KEY_SOURCE='github-secret'

              gpg1 \
                  --homedir "${KEY_HOME}" \
                  --batch \
                  --import "${PRIVATE_KEY}"
          else
              KEY_SOURCE='disposable-poc-key'

              cat > /signing/generate-key.batch <<'KEY_CONFIG'
          Key-Type: RSA
          Key-Length: 3072
          Name-Real: XO Lite RPM CI
          Name-Email: xo-lite-rpm-ci@whitestack.com
          Expire-Date: 30d
          %no-protection
          %commit
          KEY_CONFIG

              chmod 0600 /signing/generate-key.batch

              gpg1 \
                  --homedir "${KEY_HOME}" \
                  --batch \
                  --gen-key /signing/generate-key.batch
          fi

          KEY_FPR="$(
              gpg1 \
                  --homedir "${KEY_HOME}" \
                  --with-colons \
                  --fingerprint \
                  --list-secret-keys \
              | awk -F: '$1 == "fpr" { print $10; exit }'
          )"

          test -n "${KEY_FPR}"

          NORMALIZED_EXPECTED_FPR="$(
              printf '%s' "${EXPECTED_FPR}" \
                  | tr -d '[:space:]' \
                  | tr '[:lower:]' '[:upper:]'
          )"

          if [ -n "${NORMALIZED_EXPECTED_FPR}" ] \
              && [ "${KEY_FPR}" != "${NORMALIZED_EXPECTED_FPR}" ]; then
              echo "Imported key fingerprint does not match RPM_GPG_EXPECTED_FINGERPRINT." >&2
              exit 1
          fi

          printf '%s\n' "${KEY_FPR}" > "${FINGERPRINT_FILE}"
          printf '%s\n' "${KEY_SOURCE}" > /signing/key-source

          PUBLIC_KEY_TMP="${PUBLIC_KEY}.tmp"

          gpg1 \
              --homedir "${KEY_HOME}" \
              --batch \
              --armor \
              --export "${KEY_FPR}" \
              > "${PUBLIC_KEY_TMP}"

          test -s "${PUBLIC_KEY_TMP}"
          grep -q '^-----BEGIN PGP PUBLIC KEY BLOCK-----$' "${PUBLIC_KEY_TMP}"
          mv -f "${PUBLIC_KEY_TMP}" "${PUBLIC_KEY}"

          cat > /root/.rpmmacros <<RPM_MACROS
          %_signature gpg
          %_gpg_name ${KEY_FPR}
          %_gpg_path ${KEY_HOME}
          %_gpgbin /usr/bin/gpg1
          %__gpg /usr/bin/gpg1
          %_gpg_digest_algo sha256
          RPM_MACROS

          rpmsign --addsign "${RPM_FILE}"

          rpm --import "${PUBLIC_KEY}"
          rpmkeys --checksig --verbose "${RPM_FILE}"

          chmod 0644 \
              "${FINGERPRINT_FILE}" \
              "${PUBLIC_KEY}" \
              /signing/key-source

          chmod a+r "${RPM_FILE}"

          echo "Signed RPM: ${RPM_FILE}"
          echo "Signing key: ${KEY_FPR} (${KEY_SOURCE})"
          IN_SIGNER

          test -s "${SIGNING_DIR}/key-fingerprint"
          test -s "${SIGNING_DIR}/RPM-GPG-KEY-xo-lite"
          test -s "${SIGNING_DIR}/key-source"

          cleanup_private_key_file
          trap - EXIT

      - name: Prepare publication bundle
        shell: bash
        run: |
          set -euo pipefail

          RPM_FILE="${RPM_OUTPUT}/${RPM_RELATIVE}"
          RPM_BASENAME="$(basename "${RPM_FILE}")"
          PUBLIC_KEY="${SIGNING_DIR}/RPM-GPG-KEY-xo-lite"

          test -s "${RPM_FILE}"
          test -s "${PUBLIC_KEY}"

          install -m 0644 \
              "${RPM_FILE}" \
              "${DIST_DIR}/${RPM_BASENAME}"

          install -m 0644 \
              "${PUBLIC_KEY}" \
              "${DIST_DIR}/RPM-GPG-KEY-xo-lite"

          (
              cd "${DIST_DIR}"

              sha256sum "${RPM_BASENAME}" > SHA256SUMS

              {
                  printf 'RPM_FILE=%s\n' "${RPM_BASENAME}"
                  printf 'RPM_RELEASE=%s\n' "${RPM_RELEASE}"
                  printf 'GITHUB_SHA=%s\n' "${GITHUB_SHA}"
                  printf 'GITHUB_RUN_ID=%s\n' "${GITHUB_RUN_ID}"
                  printf 'GITHUB_RUN_NUMBER=%s\n' "${GITHUB_RUN_NUMBER}"
                  printf 'GITHUB_RUN_ATTEMPT=%s\n' "${GITHUB_RUN_ATTEMPT}"
                  printf 'GPG_KEY_SOURCE=%s\n' "$(<"${SIGNING_DIR}/key-source")"
                  printf 'GPG_FINGERPRINT=%s\n' \
                      "$(tr -d '[:space:]' < "${SIGNING_DIR}/key-fingerprint")"
              } > manifest.env
          )

          printf 'RPM_BASENAME=%s\n' "${RPM_BASENAME}" \
              >> "${GITHUB_ENV}"

          find "${DIST_DIR}" \
              -maxdepth 1 \
              -type f \
              -printf '%f\n' \
              | sort

      - name: Save signed RPM as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: xo-lite-rpm
          path: |
            dist/*.rpm
            dist/RPM-GPG-KEY-xo-lite
            dist/SHA256SUMS
            dist/manifest.env
          retention-days: 30
          if-no-files-found: error

      - name: Upload signed RPM to Google Artifact Registry
        if: >-
          ${{
            (github.event_name == 'workflow_dispatch' && inputs.publish_to_google) ||
            startsWith(github.ref, 'refs/tags/rpm-hydron-')
          }}
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_LOCATION: ${{ vars.GCP_LOCATION }}
          GAR_YUM_REPOSITORY: ${{ vars.GAR_YUM_REPOSITORY }}
        run: |
          set -euo pipefail

          : "${GCP_PROJECT_ID:?GCP_PROJECT_ID is required}"
          : "${GCP_LOCATION:?GCP_LOCATION is required}"
          : "${GAR_YUM_REPOSITORY:?GAR_YUM_REPOSITORY is required}"

          gcloud artifacts yum upload \
              "${GAR_YUM_REPOSITORY}" \
              --project="${GCP_PROJECT_ID}" \
              --location="${GCP_LOCATION}" \
              --source="${DIST_DIR}/${RPM_BASENAME}" \
              --quiet
